# Supabase local development config for Moon-Bird.
# Regenerate defaults with `supabase init`; keep this file valid TOML.
project_id = "moon-bird"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local email testing UI. Auth OTP/magic-link mails land here in development.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Local dev keeps confirmations off so Inbucket OTP flows are frictionless.
enable_confirmations = false

# TODO(operator): production SMTP is unconfigured here on purpose (audit A9).
# Configure it in the hosted Supabase dashboard, not this local file, and do
# NOT reuse the Gmail app password that leaked in git history — rotate it.
# Sender identity should read "Moon-Bird".

[auth.external.google]
enabled = false

[auth.external.github]
enabled = false

[auth.external.gitlab]
enabled = false
